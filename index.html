<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="game-ui">
            <div class="score">Score: <span id="scoreValue">0</span></div>
            <div class="high-score">High Score: <span id="highScoreValue">0</span></div>
            <div class="lives">Lives: <span id="livesValue">3</span> ❤️</div>
        </div>
        <div class="controls-info">
            🎮 Move: ← → | Shoot: Space or Click/Tap
        </div>
        <div class="game-over" id="gameOverScreen" style="display: none;">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Play Again 🔄</button>
        </div>
        <div class="start-screen" id="startScreen">
            <h1>🚀 SPACE SHOOTER 🚀</h1>
            <p>Defend Earth from alien invaders!</p>
            <button id="startButton">Start Game ▶️</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
